<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TardiGrader</title>
  <meta name="description" content="Mündliche Noten im Fach Biologie schnell erfassen und bekanntgeben – offline, alle Daten bleiben auf dem Gerät.">
  <meta name="theme-color" content="#3E3A9E" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14151F" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TardiGrader">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-64.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <style id="page-style">@page { size: A4 landscape; margin: 10mm; }</style>
</head>
<body>
  <div id="app" class="app" aria-live="polite"></div>
  <div id="print-root" class="print-root" hidden></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript>TardiGrader benötigt JavaScript.</noscript>
  <script src="vendor/docx.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
