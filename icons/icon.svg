    <!-- Mund und Auge -->
    <circle cx="92" cy="264" r="7" fill="#3E3A9E"/>
    <circle cx="140" cy="240" r="10" fill="#2A2770"/>
    <circle cx="143" cy="237" r="3" fill="#F5E6EC"/>
