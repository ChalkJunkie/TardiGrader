<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TardiGrader – stilisiertes Bärtierchen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A45B5"/><stop offset="1" stop-color="#2E2A86"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(-8 -6)">
  <g id="bear">
    <!-- Beine (4 Paare, seitlich gesehen 4 sichtbar) -->
