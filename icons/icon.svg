      <rect x="150" y="286" width="46" height="78" rx="23"/>
      <rect x="222" y="296" width="46" height="74" rx="23"/>
      <rect x="294" y="296" width="46" height="74" rx="23"/>
      <rect x="370" y="278" width="46" height="80" rx="23" transform="rotate(-22 393 318)"/>
    </g>
    <!-- Krallen -->
    <g fill="none" stroke="#F5E6EC" stroke-width="9" stroke-linecap="round">
      <path d="M160 360 q-10 12 -22 14"/><path d="M173 364 q-4 13 -12 20"/><path d="M186 362 q2 13 -2 22"/>
      <path d="M232 366 q-10 12 -22 14"/><path d="M245 370 q-4 13 -12 20"/><path d="M258 368 q2 13 -2 22"/>
      <path d="M304 366 q-10 12 -22 14"/><path d="M317 370 q-4 13 -12 20"/><path d="M330 368 q2 13 -2 22"/>
      <path d="M414 346 q4 14 16 22"/><path d="M424 338 q10 10 24 12"/><path d="M402 352 q-2 14 4 24"/>
